name: Deploy Pages

on:
  schedule:
    - cron: '0 0 * * 0-4'   # 3 صباحاً بتوقيت القاهرة (UTC+3)
    - cron: '0 8 * * 0-4'   # 11 صباحاً بتوقيت القاهرة (UTC+3)
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger GitHub Pages deployment
        run: |
          curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.PERSONAL_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/a7medhe4am/Wallet/pages/builds || true
