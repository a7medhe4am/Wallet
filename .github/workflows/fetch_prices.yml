name: Fetch Stock Prices

on:
  schedule:
    - cron: '0 1 * * 0-4'   # 6 صباحاً بتوقيت القاهرة (UTC+2)
    - cron: '0 5 * * 0-4'   # 8 صباحاً بتوقيت القاهرة - backup
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas

      - name: Fetch prices
        run: python fetch_prices.py

      - name: Commit prices.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add prices.json
          git diff --staged --quiet || git commit -m "Update prices $(date +'%Y-%m-%d %H:%M')"
          git push

      - name: Trigger GitHub Pages deployment
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.PERSONAL_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/a7medhe4am/Wallet/pages/builds
